%common

##begin config
basename CEF
version 1.0
residentpri -119
options noexpunge
##end config

##begin cdef
#include <libraries/cef.h>
##end cdef

##begin functionlist
.version 1
LONG cef_version_info(LONG entry) (D0)
CONST_STRPTR cef_api_hash(LONG entry) (D0)
LONG CEFExecuteProcess(APTR args, APTR application, APTR sandbox_info) (A0, A1, A2)
LONG CEFInitialize(APTR args, APTR settings, APTR application, APTR sandbox_info) (A0, A1, A2, A3)
void CEFShutdown() ()
void CEFDoMessageLoopWork() ()
void CEFRunMessageLoop() ()
void CEFQuitMessageLoop() ()
LONG CEFCreateBrowser(APTR window_info, APTR client, APTR url, APTR settings, APTR extra_info, APTR request_context) (A0, A1, A2, A3, D0, D1)
LONG CEFPostTask(LONG thread_id, APTR task) (D0, A0)
LONG CEFPostDelayedTask(LONG thread_id, APTR task, LONG delay_ms) (D0, A0, D1)
LONG CEFRegisterV8Extension(APTR name, APTR javascript_code, APTR handler) (A0, A1, A2)
LONG CEFDefaultV8WorkerThreadCount() ()
void CEFGetAllocator(APTR *allocFn, APTR *freeFn) (A0, A1)
LONG CEFRegisterSchemeHandlerFactory(APTR scheme_name, APTR domain_name, APTR factory) (A0, A1, A2)
void CEFStringUserfreeFree(APTR str) (A0)
##end functionlist
