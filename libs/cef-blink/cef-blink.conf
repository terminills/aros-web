%common

##begin config
basename CEFBlink
version 1.0
residentpri -118
options noexpunge
##end config

##begin cdef
#include <libraries/cef-blink.h>
##end cdef

##begin functionlist
.version 1
LONG CEFBlinkVersionInfo(LONG entry) (D0)
CONST_STRPTR CEFBlinkApiHash(LONG entry) (D0)
LONG CEFBlinkExecuteProcess(APTR args, APTR application, APTR sandbox_info) (A0, A1, A2)
LONG CEFBlinkInitialize(APTR args, APTR settings, APTR application, APTR sandbox_info) (A0, A1, A2, A3)
void CEFBlinkShutdown() ()
void CEFBlinkDoMessageLoopWork() ()
void CEFBlinkRunMessageLoop() ()
void CEFBlinkQuitMessageLoop() ()
LONG CEFBlinkCreateBrowser(APTR window_info, APTR client, APTR url, APTR settings, APTR extra_info, APTR request_context) (A0, A1, A2, A3, D0, D1)
LONG CEFBlinkPostTask(LONG thread_id, APTR task) (D0, A0)
LONG CEFBlinkPostDelayedTask(LONG thread_id, APTR task, LONG delay_ms) (D0, A0, D1)
LONG CEFBlinkRegisterV8Extension(APTR name, APTR javascript_code, APTR handler) (A0, A1, A2)
LONG CEFBlinkDefaultV8WorkerThreadCount() ()
void CEFBlinkGetAllocator(APTR *allocFn, APTR *freeFn) (A0, A1)
LONG CEFBlinkRegisterSchemeHandlerFactory(APTR scheme_name, APTR domain_name, APTR factory) (A0, A1, A2)
void CEFBlinkStringUserfreeFree(APTR str) (A0)
##end functionlist
